<!doctype html>
<html lang="vi">
  <body style="margin:0;padding:24px;background:#f3f7fc;font-family:Arial,sans-serif;color:#102a48">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #dbe7f4;border-radius:18px">
            <tr>
              <td style="padding:30px">
                <p style="margin:0 0 10px;color:#2563eb;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Chốn Học Tập</p>
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3">Khôi phục mật khẩu</h1>
                <p style="margin:0;color:#566d89;font-size:14px;line-height:1.7">
                  Nhập mã xác nhận dưới đây trên trang khôi phục mật khẩu:
                </p>
                <div style="margin:24px 0;padding:18px;border-radius:14px;background:#eef5ff;color:#1d4ed8;text-align:center;font-size:30px;font-weight:800;letter-spacing:.28em">
                  {{ .Token }}
                </div>
                <p style="margin:0;color:#566d89;font-size:13px;line-height:1.7">
                  Mã chỉ dùng một lần và sẽ hết hạn. Nếu bạn không yêu cầu đổi mật khẩu, hãy bỏ qua email này.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
